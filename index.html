<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1323" />
  <title>Fluxa — Circuit Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Fluxa">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/fluxa-logo.png" alt="" />
        </div>
        <div><strong>Fluxa</strong><span>circuit studio</span></div>
      </div>

      <div class="project-title-wrap">
        <button class="project-title" id="projectTitleBtn" title="Rename project">
          <span class="project-dot"></span><span id="projectName">LED Signal Lab</span><svg class="chevron" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <span class="save-status" id="saveStatus"><i></i>Saved locally</span>
      </div>

      <div class="top-actions">
        <div class="history-actions" aria-label="History">
          <button class="icon-button" id="undoBtn" title="Undo (Ctrl / ⌘ Z)" aria-label="Undo" disabled>
            <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 1 1 0 12"/></svg>
          </button>
          <button class="icon-button" id="redoBtn" title="Redo (Ctrl / ⌘ Shift Z)" aria-label="Redo" disabled>
            <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m5-5H10a6 6 0 1 0 0 12"/></svg>
          </button>
        </div>
        <button class="new-project-button" id="newProjectBtn" title="Create a new empty project"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M12 10v7M8.5 13.5h7"/></svg>New</button>
        <button class="theme-button" id="themeToggleBtn" title="Switch to light theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="themeLabel">Light</span></button>
        <button class="about-button" id="aboutBtn" title="About Fluxa"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 10v6M12 7.2v.2"/></svg>About</button>
        <button class="ai-top-button" id="aiTopBtn"><span class="sparkle">✦</span>AI tools</button>
        <button class="simulate-button" id="simulateBtn"><span class="play-icon">▶</span><span id="simulateLabel">Simulate</span></button>
        <button class="share-button" id="shareBtn"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.3"/><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="19" r="2.3"/><path d="m8 11 7.8-4.8M8 13l7.8 4.8"/></svg>Share</button>
        <button class="export-button" id="exportBtn">Export <svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
      </div>
    </header>

    <main class="workspace">
      <aside class="library-panel" aria-label="Component library">
        <div class="panel-heading">
          <div><span class="eyebrow">Parts &amp; models</span><h2>Library</h2></div>
          <button class="small-icon" id="libraryMoreBtn" title="Library preferences"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
        </div>
        <label class="search-input">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input type="search" id="partSearch" placeholder="Search parts or models" autocomplete="off" />
          <kbd>⌘K</kbd>
        </label>
        <div class="library-tabs" id="libraryTabs" role="tablist">
          <button class="library-tab active" data-category="all">All</button>
          <button class="library-tab" data-category="core">Core</button>
          <button class="library-tab" data-category="semi">Semi</button>
          <button class="library-tab" data-category="ic">ICs</button>
        </div>
        <div class="component-list" id="componentList"></div>
        <div class="library-footer">
          <div class="fritzing-note"><span class="mini-grid"></span><span>SVG part mapping<br><b>Fritzing-compatible</b></span></div>
          <button id="showShortcutsBtn">Shortcuts <span>?</span></button>
        </div>
      </aside>

      <section class="studio" aria-label="Circuit editor">
        <div class="editor-toolbar">
          <div class="tool-group editor-tools" aria-label="Editor tool">
            <button class="tool-button active" data-tool="select" title="Select and move (V)"><svg viewBox="0 0 24 24"><path d="m5 3 12.6 8.2-6.1 1.3 3.5 6.5-3.1 1.6-3.5-6.5-3.3 5.3z"/></svg><span>Select</span></button>
            <button class="tool-button" data-tool="wire" title="Wire terminals (W)"><svg viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.8"/><circle cx="19" cy="17" r="1.8"/><path d="M6.5 8.2c4 0 4.3 7.6 10.7 7.6"/></svg><span>Wire</span></button>
            <button class="tool-button" data-tool="probe" title="Measure two points (M)"><svg viewBox="0 0 24 24"><path d="M5 4v7a7 7 0 0 0 14 0V4M3.5 4h3M17.5 4h3M8 16l-2.8 4M16 16l2.8 4"/></svg><span>Probe</span></button>
          </div>
          <span class="toolbar-divider"></span>
          <div class="tool-group">
            <button class="icon-tool" id="deleteToolBtn" title="Delete selected (Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M9 4h6l1 3H8zM6.5 7l.8 13h9.4l.8-13"/></svg></button>
            <button class="icon-tool" id="fitBtn" title="Fit circuit to view"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5M3 8l5-5M16 3l5 5M3 16l5 5M16 21l5-5"/></svg></button>
          </div>
          <div class="view-control-group">
            <div class="view-switch" role="group" aria-label="Editor view">
              <button class="active" data-view="schematic">Schematic</button>
              <button data-view="breadboard">Breadboard</button>
            </div>
            <label class="board-texture-toggle hidden" id="boardTextureToggleWrap" title="Show a perforated breadboard background">
              <input type="checkbox" id="boardTextureToggle" checked />
              <span class="board-texture-check" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>
              <span>Board holes</span>
            </label>
          </div>
          <div class="zoom-controls">
            <button id="zoomOutBtn" title="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zoomInBtn" title="Zoom in">+</button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <div class="canvas-status-row">
            <div class="status-chip" id="circuitStateChip"><i></i><span>Ready to simulate</span></div>
            <div class="canvas-help" id="canvasHelp">Drag a part here or press <kbd>W</kbd> to wire pins</div>
          </div>
          <svg id="circuitCanvas" class="circuit-canvas" viewBox="0 0 1200 690" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Electronic circuit canvas">
            <defs>
              <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#243147" stroke-width="0.7" opacity="0.52"/>
                <circle cx="0" cy="0" r="0.85" fill="#31405a" opacity="0.65"/>
              </pattern>
              <pattern id="lightGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#b8c8db" stroke-width="0.7" opacity="0.74"/>
                <circle cx="0" cy="0" r="0.85" fill="#8ea7c1" opacity="0.72"/>
              </pattern>
              <pattern id="fineDots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.85" fill="#586174" opacity=".48"/></pattern>
              <pattern id="boardLines" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="2.1" fill="#323947"/><circle cx="9" cy="9" r=".7" fill="#141a25"/></pattern>
              <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <filter id="chipShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#02050b" flood-opacity=".44"/></filter>
              <linearGradient id="sourceFace" x1="0" x2="1"><stop stop-color="#253856"/><stop offset="1" stop-color="#18243a"/></linearGradient>
              <linearGradient id="ledBody" x1="0" x2="1"><stop stop-color="#4cf2ac"/><stop offset=".55" stop-color="#14b77b"/><stop offset="1" stop-color="#098c62"/></linearGradient>
              <radialGradient id="thermalGreen"><stop stop-color="#ffd45b" stop-opacity=".8"/><stop offset=".45" stop-color="#54e4a3" stop-opacity=".24"/><stop offset="1" stop-color="#54e4a3" stop-opacity="0"/></radialGradient>
              <radialGradient id="thermalHot"><stop stop-color="#ff4d5d" stop-opacity=".82"/><stop offset=".38" stop-color="#ff9346" stop-opacity=".35"/><stop offset="1" stop-color="#ff9346" stop-opacity="0"/></radialGradient>
            </defs>
            <rect id="canvasBackground" x="-2000" y="-2000" width="6000" height="6000" fill="url(#gridPattern)"/>
            <g id="breadboardBackground" class="hidden"></g>
            <g id="wireLayer"></g>
            <g id="componentLayer"></g>
            <g id="annotationLayer"></g>
            <g id="interactionLayer"></g>
          </svg>
          <div class="selection-quick-actions hidden" id="selectionQuickActions" role="toolbar" aria-label="Selected item actions"></div>
          <div class="canvas-bottom-left">
            <button class="canvas-toggle" id="snapBtn"><span class="snap-dot"></span>Snap <b>20</b></button>
            <button class="canvas-toggle" id="thermalBtn"><span class="heat-dot"></span>Heat map</button>
          </div>
          <div class="minimap" aria-hidden="true"><div class="minimap-grid"><span></span><i></i><b></b></div><div id="konvaMinimap" class="konva-minimap"></div><div class="minimap-viewport"></div></div>
        </div>

        <section class="lab-drawer" id="labDrawer" aria-label="Signal lab">
          <div class="lab-resize-handle" id="labResizeHandle" role="separator" aria-orientation="horizontal" aria-label="Resize Signal lab" aria-valuemin="112" aria-valuemax="420" tabindex="0" title="Drag to resize Signal lab. Double-click to reset."><span></span></div>
          <div class="lab-header">
            <div class="lab-title"><span class="scope-mark"><i></i><i></i><i></i></span><span>Signal lab</span><span class="live-pill">LIVE</span></div>
            <div class="lab-tabs" role="tablist"><button class="active" data-labtab="scope">Oscilloscope</button><button data-labtab="spectrum">Spectrum</button><button data-labtab="thermal">Thermal</button></div>
            <div class="lab-actions"><button id="addChannelBtn">+ Channel</button><button class="icon-tool small" id="collapseLabBtn" title="Collapse lab"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button></div>
          </div>
          <div class="lab-content" id="labContent"></div>
        </section>
      </section>

      <aside class="inspector-panel" aria-label="Circuit inspector">
        <div class="inspector-tabs" role="tablist">
          <button class="active" data-righttab="properties">Properties</button>
          <button data-righttab="measurements">Measurements</button>
          <button data-righttab="assistant"><span class="tab-spark">✦</span>Inspector</button>
        </div>
        <div class="inspector-content" id="inspectorContent"></div>
      </aside>
    </main>
  </div>

  <div class="popover export-menu hidden" id="exportMenu">
    <div class="popover-title">Circuit file</div>
    <button data-export="png"><span class="export-file file-png">PNG</span><span><b>PNG image</b><small>Canvas snapshot at 2×</small></span></button>
    <button data-export="svg"><span class="export-file file-svg">SVG</span><span><b>Editable SVG</b><small>Vector drawing of the active view</small></span></button>
    <button data-export="json"><span class="export-file file-json">JSON</span><span><b>Export Fluxa JSON</b><small>Save this editable circuit</small></span></button>
    <div class="popover-divider"></div>
    <button data-export="import"><span class="export-file file-import">IN</span><span><b>Import Fluxa JSON</b><small>Open a saved editable circuit</small></span></button>
  </div>
  <input class="hidden" id="jsonImportInput" type="file" accept=".json,.fluxa.json,application/json" />

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="vendor/konva.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
